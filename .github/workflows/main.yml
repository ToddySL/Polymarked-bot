name: Run Polymarket Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: pip install requests

      - name: Kjør botten
        run: python main.py

      - name: Lagre database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trades.db
          git diff --cached --quiet || git commit -m "Oppdater trade database"
          git push
